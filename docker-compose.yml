version: "3.9"

services:
  db:
    image: ankane/pgvector:latest
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contractiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contractiq}
      POSTGRES_DB: ${POSTGRES_DB:-contractiq}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-contractiq}:${POSTGRES_PASSWORD:-contractiq}@db:5432/${POSTGRES_DB:-contractiq}
    volumes:
      - uploads:/app/uploads
    ports:
      - "8000:8000"

volumes:
  pgdata:
  uploads:

